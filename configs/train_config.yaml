# Training hyperparameters for the tiled Dubia dataset.
# Images are already 512x512 tiles, so training at 512 avoids a useless upscale.
model: yolov8n.pt
epochs: 50
imgsz: 512
batch: 8
workers: 0
patience: 50
save: true
exist_ok: true
name: dubia
device: "cpu"

# Tiles are already cropped. A strong mosaic shrinks the insects and,
# with close_mosaic, only the last 10 epochs show unmodified images.
degrees: 20.0
flipud: 0.5
fliplr: 0.5
scale: 0.2
mosaic: 0.5
close_mosaic: 10
mixup: 0.0
